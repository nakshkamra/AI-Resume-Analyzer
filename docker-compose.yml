services:
  careerfit:
    build:
      context: .
      dockerfile: Dockerfile
    image: careerfit:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CAREERFIT_DATABASE_PATH: ${CAREERFIT_DATABASE_PATH:-/data/resume_analyzer.db}
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
    volumes:
      - careerfit_data:/data
      - careerfit_model_cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  careerfit_data:
  careerfit_model_cache:
