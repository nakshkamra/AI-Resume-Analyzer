services:
  careerfit:
    build:
      context: .
      dockerfile: Dockerfile
    image: careerfit:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CAREERFIT_DATABASE_PATH: ${CAREERFIT_DATABASE_PATH:-/data/resume_analyzer.db}
    volumes:
      - careerfit_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  careerfit_data:
